<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>client</title>
    <style id="loading-splash-style">#loading-splash{
  position:fixed; inset:0; z-index:2147483647;
  display:flex; align-items:center; justify-content:center;
  background:#fdfff1;
  transition:opacity .4s ease;
}
#loading-splash.splash-hide{ opacity:0; pointer-events:none; }
.dog-loader {
  position: relative;
  width: 23.5vmax;
  height: 23.5vmax;
  display: flex;
  justify-content: center;
  align-items: center;
  /* Makes a stacking context so the negative z-index layers below
     (legs/body behind the dog) stay inside the loader instead of
     slipping behind the page background. */
  isolation: isolate;
}

.dog-loader .leg {
  position: absolute;
  bottom: 0;
  width: 2vmax;
  height: 2.125vmax;
}

.dog-loader .paw {
  position: absolute;
  bottom: 2px;
  left: 0;
  width: 1.95vmax;
  height: 1.8vmax;
  overflow: hidden;
}

.dog-loader .paw::before {
  content: "";
  position: absolute;
  width: 5vmax;
  height: 3vmax;
  border-radius: 50%;
}

.dog-loader .top {
  position: absolute;
  bottom: 0;
  left: 0.75vmax;
  height: 4.5vmax;
  width: 2.625vmax;
  border-top-left-radius: 1.425vmax;
  border-top-right-radius: 1.425vmax;
  transform-origin: bottom right;
  transform: rotateZ(90deg) translateX(-0.1vmax) translateY(1.5vmax);
  z-index: -1;
  background-image: linear-gradient(70deg, transparent 20%, #deac80 20%);
}

.dog-loader .dog {
  position: relative;
  width: 20vmax;
  height: 8vmax;
}

.dog-loader .dog::before {
  content: "";
  position: absolute;
  bottom: -0.75vmax;
  right: -0.15vmax;
  width: 100%;
  height: 1.5vmax;
  background-color: #b5c18e;
  border-radius: 50%;
  z-index: -1000;
  animation: dl-shadow 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
}

.dog-loader .dog__head {
  position: absolute;
  left: 4.5vmax;
  bottom: 0;
  width: 8vmax;
  height: 5vmax;
  border-top-left-radius: 4.05vmax;
  border-top-right-radius: 4.05vmax;
  border-bottom-right-radius: 3.3vmax;
  border-bottom-left-radius: 3.3vmax;
  background-color: #deac80;
  animation: dl-head 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
}

.dog-loader .dog__head-c {
  position: absolute;
  left: 1.5vmax;
  bottom: 0;
  width: 9.75vmax;
  height: 8.25vmax;
  animation: dl-head 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
  z-index: -1;
}

.dog-loader .dog__snout {
  position: absolute;
  left: -1.5vmax;
  bottom: 0;
  width: 7.5vmax;
  height: 3.75vmax;
  border-top-right-radius: 3vmax;
  border-bottom-right-radius: 3vmax;
  border-bottom-left-radius: 4.5vmax;
  background-color: #f7dcb9;
  animation: dl-snout 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
}

.dog-loader .dog__snout::before {
  content: "";
  position: absolute;
  left: -0.1125vmax;
  top: -0.15vmax;
  width: 1.875vmax;
  height: 1.125vmax;
  border-top-right-radius: 3vmax;
  border-bottom-right-radius: 3vmax;
  border-bottom-left-radius: 4.5vmax;
  background-color: #6c4e31;
  animation: dl-snout-b 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
}

.dog-loader .dog__eye-l,
.dog-loader .dog__eye-r {
  position: absolute;
  top: -0.9vmax;
  width: 0.675vmax;
  height: 0.375vmax;
  border-radius: 50%;
  background-color: #1c3130;
  animation: dl-eye 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
}

.dog-loader .dog__eye-l {
  left: 27%;
}

.dog-loader .dog__eye-r {
  left: 65%;
}

.dog-loader .dog__ear-l,
.dog-loader .dog__ear-r {
  position: absolute;
  width: 5vmax;
  height: 3.3vmax;
  border-top-left-radius: 3.3vmax;
  border-top-right-radius: 3vmax;
  border-bottom-right-radius: 5vmax;
  border-bottom-left-radius: 5vmax;
  background-color: #deac80;
}

.dog-loader .dog__ear-l {
  top: 1.5vmax;
  left: 10vmax;
  transform-origin: bottom left;
  transform: rotateZ(-50deg);
  z-index: -1;
  animation: dl-ear-l 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
}

.dog-loader .dog__ear-r {
  top: 1.5vmax;
  right: 3vmax;
  transform-origin: bottom right;
  transform: rotateZ(25deg);
  z-index: -2;
  animation: dl-ear-r 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
}

.dog-loader .dog__body {
  display: flex;
  justify-content: center;
  align-items: flex-end;
  position: absolute;
  bottom: 0.3vmax;
  left: 6vmax;
  width: 18vmax;
  height: 4vmax;
  border-top-left-radius: 3vmax;
  border-top-right-radius: 6vmax;
  border-bottom-right-radius: 1.5vmax;
  border-bottom-left-radius: 6vmax;
  background-color: #914f1e;
  z-index: -2;
  animation: dl-body 10s cubic-bezier(0.3, 0.41, 0.18, 1.01) infinite;
}

.dog-loader .dog__tail {
  position: absolute;
  top: 20px;
  right: -1.5vmax;
  height: 3vmax;
  width: 4vmax;
  background-color: #914f1e;
  border-radius: 1.5vmax;
}

.dog-loader .dog__paws {
  position: absolute;
  bottom: 0;
  left: 7.5vmax;
  width: 10vmax;
  height: 3vmax;
}

.dog-loader .dog__bl-leg {
  left: -3vmax;
  z-index: -10;
}

.dog-loader .dog__bl-paw::before {
  background-color: #fffbe6;
}

.dog-loader .dog__bl-top {
  background-image: linear-gradient(80deg, transparent 20%, #deac80 20%);
}

.dog-loader .dog__fl-leg {
  z-index: 10;
  left: 0;
}

.dog-loader .dog__fl-paw::before {
  background-color: #fffbe6;
}

.dog-loader .dog__fr-leg {
  right: 0;
}

.dog-loader .dog__fr-paw::before {
  background-color: #fffbe6;
}

@keyframes dl-head {
  0%,
  10%,
  20%,
  26%,
  28%,
  90%,
  100% {
    height: 8.25vmax;
    bottom: 0;
    transform-origin: bottom right;
    transform: rotateZ(0);
  }
  5%,
  15%,
  22%,
  24%,
  30% {
    height: 8.1vmax;
  }
  32%,
  50% {
    height: 8.25vmax;
  }
  55%,
  60% {
    bottom: 0.75vmax;
    transform-origin: bottom right;
    transform: rotateZ(0);
  }
  70%,
  80% {
    bottom: 0.75vmax;
    transform-origin: bottom right;
    transform: rotateZ(10deg);
  }
}

@keyframes dl-body {
  0%,
  10%,
  20%,
  26%,
  28%,
  32%,
  100% {
    height: 7.2vmax;
  }
  5%,
  15%,
  22%,
  24%,
  30% {
    height: 7.05vmax;
  }
}

@keyframes dl-ear-l {
  0%,
  10%,
  20%,
  26%,
  28%,
  82%,
  100% {
    transform: rotateZ(-50deg);
  }
  5%,
  15%,
  22%,
  24% {
    transform: rotateZ(-48deg);
  }
  30%,
  31% {
    transform: rotateZ(-30deg);
  }
  32%,
  80% {
    transform: rotateZ(-60deg);
  }
}

@keyframes dl-ear-r {
  0%,
  10%,
  20%,
  26%,
  28% {
    transform: rotateZ(20deg);
  }
  5%,
  15%,
  22%,
  24% {
    transform: rotateZ(18deg);
  }
  30%,
  31% {
    transform: rotateZ(10deg);
  }
  32% {
    transform: rotateZ(25deg);
  }
}

@keyframes dl-snout {
  0%,
  10%,
  20%,
  26%,
  28%,
  82%,
  100% {
    height: 3.75vmax;
  }
  5%,
  15%,
  22%,
  24% {
    height: 3.45vmax;
  }
}

@keyframes dl-snout-b {
  0%,
  10%,
  20%,
  26%,
  28%,
  98%,
  100% {
    width: 1.875vmax;
  }
  5%,
  15%,
  22%,
  24% {
    width: 1.8vmax;
  }
  34%,
  98% {
    width: 1.275vmax;
  }
}

@keyframes dl-shadow {
  0%,
  10%,
  20%,
  26%,
  28%,
  30%,
  84%,
  100% {
    width: 99%;
  }
  5%,
  15%,
  22%,
  24% {
    width: 101%;
  }
  34%,
  81% {
    width: 96%;
  }
}

@keyframes dl-eye {
  0%,
  30% {
    width: 0.675vmax;
    height: 0.3vmax;
  }
  32%,
  59%,
  90%,
  100% {
    width: 0.525vmax;
    height: 0.525vmax;
    transform: translateY(0);
  }
  60%,
  75% {
    transform: translateY(-0.3vmax);
  }
  80%,
  85% {
    transform: translateY(0.15vmax);
  }
}
</style>
  </head>
  <body>
    <div id="root"></div>
    <!-- Pre-hydration splash: a SIBLING of #root so React's mount doesn't clear it.
         Shows for a fixed minimum time (SPLASH_MIN_MS), then fades to reveal the app.
         Removed after it fades, so it never re-appears on later data refetches. -->
    <div id="loading-splash" data-splash>
      <div class="dog-loader" role="status" aria-label="Loading">
  <div class="dog">
    <div class="dog__paws">
      <div class="dog__bl-leg leg"><div class="dog__bl-paw paw"></div><div class="dog__bl-top top"></div></div>
      <div class="dog__fl-leg leg"><div class="dog__fl-paw paw"></div><div class="dog__fl-top top"></div></div>
      <div class="dog__fr-leg leg"><div class="dog__fr-paw paw"></div><div class="dog__fr-top top"></div></div>
    </div>
    <div class="dog__body"><div class="dog__tail"></div></div>
    <div class="dog__head">
      <div class="dog__snout">
        <div class="dog__eyes"><div class="dog__eye-l"></div><div class="dog__eye-r"></div></div>
      </div>
    </div>
    <div class="dog__head-c"><div class="dog__ear-r"></div><div class="dog__ear-l"></div></div>
  </div>
</div>
    </div>
    <script>
  (function () {
    var SPLASH_MIN_MS = 1500; // fixed minimum time the dog is shown on first load
    var s = {
      minDone: false,
      appReady: false,
      hide: function () {
        if (!s.minDone || !s.appReady) return;
        var el = document.getElementById('loading-splash');
        if (!el) return;
        el.classList.add('splash-hide'); // fade out
        setTimeout(function () { el.parentNode && el.parentNode.removeChild(el); }, 420);
      }
    };
    window.__splash = s;
    // 1) fixed minimum time
    setTimeout(function () { s.minDone = true; s.hide(); }, SPLASH_MIN_MS);
    // 2) the JS bundle has finished loading (module script blocks the load event)
    if (document.readyState === 'complete') { s.appReady = true; s.hide(); }
    else window.addEventListener('load', function () { s.appReady = true; s.hide(); });
  })();
</script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
